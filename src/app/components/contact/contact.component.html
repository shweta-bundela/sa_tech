<div class="contact-container">
    <!-- Contact Header -->
    <div class="contact-header text-center">
      <img src="SATechIcon.jpg" alt="SATechnology Logo" class="contact-logo">
      <h1>Contact Us</h1>
      <p>We’d love to hear from you! Choose an option below to get in touch.</p>
    </div>
  
    <!-- Contact Options -->
    <div class="contact-options">
      <div class="contact-option">
        <button class="contact-btn call-btn" (click)="makeCall()">
          <i class="fas fa-phone-alt"></i> Call Us
        </button>
      </div>
  
      <div class="contact-option">
        <button class="contact-btn mail-btn" (click)="sendEmail()">
          <i class="fas fa-envelope"></i> Send an Email
        </button>
      </div>
  
      <div class="contact-option">
        <button class="contact-btn chat-btn" (click)="startChat()">
          <i class="fas fa-comment-dots"></i> Start Chat
        </button>
      </div>
    </div>
  </div>
